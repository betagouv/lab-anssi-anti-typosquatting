<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerte - Site suspicieux</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <div>
        <div class="badge">
            <img src="warning.svg" alt="Icône d'avertissement"/>
            <span>Site web non sécurisée</span>
        </div>
        <h1>Cette page n’est pas sûre</h1>
        <h2 id="blocked-domain"></h2>
        <div class="bloc-risque">
            <p>Risque</p>
            <div class="score">
                <span id="final-score"></span>
                <div class="progress-bar"></div>
            </div>
        </div>
            <p class="contenu">
                Ce site pourrait contenir des contenus dangereux susceptibles de vous nuire. Il a été bloqué pour garantir votre sécurité en ligne.
                <br>
                <br>
                Vous cherchiez peut-être à accéder à ce site sécurisé :
                <a id="safe-domain"></a>
            </p>
        <div class="actions">
            <a class="primaire" id="close">Retour</a>
            <a class="secondaire" id="blocked-domain-link">Visiter quand même</a>
        </div>
    </div>
    <div class="conteneur-image">
        <img src="illustration.svg" alt="Illustration" />
    </div>
</main>
