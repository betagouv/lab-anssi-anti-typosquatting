name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    name: Types, style et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests, liste légitime entière comprise
        run: npm run test:complet

  generation-deterministe:
    name: Génération déterministe de la liste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deux générations sur la même source doivent coïncider
        run: |
          npm run genere:domaines
          cp src/donnees/domaines-legitimes.txt /tmp/premiere-generation.txt
          npm run genere:domaines
          diff /tmp/premiere-generation.txt src/donnees/domaines-legitimes.txt

  classifieur:
    name: Chaîne du classifieur sur dix lignes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run classifieur:verifier-chaine
      - run: npm run classifieur:verifier-export

  extension:
    name: Empaquetage Chrome et Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - name: Modèle présent dans les deux paquets
        run: |
          test -s dist/chrome/modele/essai.bin
          test -s dist/chrome/modele/essai.json
          test -s dist/firefox/modele/essai.bin
          test -s dist/firefox/modele/essai.json
      - name: Validation du paquet Firefox
        run: npx web-ext lint --source-dir=dist/firefox --self-hosted
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: dist/
          retention-days: 14
