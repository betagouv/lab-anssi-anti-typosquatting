<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détection de typosquatting</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <div id="alerte" class="alerte alerte--info" role="status">
      <h1 id="titre-de-l-alerte" class="alerte__titre">Analyse en cours…</h1>
      <p id="description-de-l-alerte" class="alerte__description"></p>
    </div>

    <button id="naviguer-quand-meme" type="button" class="bouton bouton--secondaire" hidden>
      Naviguer quand même
    </button>

    <details id="details" class="accordeon" hidden>
      <summary class="accordeon__bouton">Détail de l’analyse</summary>
      <div class="accordeon__contenu">
        <dl id="liste-des-details" class="details"></dl>
        <p class="note">Le modèle d’essai est expérimental : seules les règles déclenchent les alertes.</p>
      </div>
    </details>
  </main>
  <script type="module" src="./principal.ts"></script>
</body>
</html>
